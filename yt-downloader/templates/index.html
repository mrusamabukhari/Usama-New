<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YT Downloader</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>

<!-- Background blobs -->
<div class="bg-blob blob1"></div>
<div class="bg-blob blob2"></div>
<div class="bg-blob blob3"></div>

<div class="container">

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
        <rect width="36" height="36" rx="10" fill="#ff4545"/>
        <polygon points="14,10 28,18 14,26" fill="white"/>
      </svg>
      <span>YT<strong>Down</strong></span>
    </div>
    <p class="tagline">Download YouTube videos &amp; audio in seconds</p>
  </header>

  <!-- URL Card -->
  <div class="card url-card" id="urlCard">
    <div class="input-row">
      <div class="input-wrap">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
        <input type="url" id="urlInput" placeholder="Paste YouTube link here…" autocomplete="off" spellcheck="false"/>
        <button class="clear-btn" id="clearBtn" title="Clear">✕</button>
      </div>
      <button class="btn btn-primary" id="fetchBtn">
        <span class="btn-label">Fetch</span>
        <span class="btn-loader hidden"></span>
      </button>
    </div>
    <div id="urlError" class="error-msg hidden"></div>
  </div>

  <!-- Preview Card (hidden until fetched) -->
  <div class="card preview-card hidden" id="previewCard">
    <div class="preview-inner">
      <img class="thumb" id="thumbImg" src="" alt="thumbnail"/>
      <div class="preview-info">
        <h2 class="video-title" id="videoTitle"></h2>
        <div class="meta-row">
          <span class="meta-chip" id="videoUploader"></span>
          <span class="meta-chip" id="videoDuration"></span>
          <span class="meta-chip" id="videoViews"></span>
        </div>

        <!-- Format / Quality controls -->
        <div class="controls-grid">
          <div class="control-group">
            <label>Format</label>
            <div class="toggle-row" id="fmtToggle">
              <button class="toggle-btn active" data-val="mp4">🎬 MP4</button>
              <button class="toggle-btn" data-val="mp3">🎵 MP3</button>
            </div>
          </div>
          <div class="control-group" id="qualityGroup">
            <label>Quality</label>
            <select id="qualitySelect" class="select">
              <option value="best">Best</option>
              <option value="1080p">1080p</option>
              <option value="720p">720p</option>
              <option value="480p">480p</option>
              <option value="360p">360p</option>
            </select>
          </div>
        </div>

        <button class="btn btn-download" id="downloadBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18">
            <path d="M12 3v13M5 14l7 7 7-7"/>
            <path d="M3 21h18"/>
          </svg>
          Download
        </button>
      </div>
    </div>
  </div>

  <!-- Active Downloads -->
  <section class="downloads-section" id="downloadsSection">
    <h3 class="section-title">Downloads</h3>
    <div id="downloadsList"></div>
  </section>

</div>

<script src="/static/js/app.js"></script>
</body>
</html>
